default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>  # Use "localhost" instead of "postgres"
  username: <%= ENV.fetch("MINATO_DATABASE_USERNAME", "minato") %>
  password: <%= ENV.fetch("MINATO_DATABASE_PASSWORD", "minato") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>

development:
  <<: *default
  database: minato_development

test:
  <<: *default
  database: minato_test

production:
  primary: &primary_production
    <<: *default
    database: minato_production
    username: <%= ENV["MINATO_DATABASE_USERNAME"] %>
    password: <%= ENV["MINATO_DATABASE_PASSWORD"] %>

  # Solid Cache / Cable / Queue live in separate databases (see config/cache.yml,
  # config/cable.yml and config/environments/production.rb). They reuse the
  # primary production credentials and differ only by database name.
  cache:
    <<: *primary_production
    database: minato_production_cache
    migrations_paths: db/cache_migrate

  cable:
    <<: *primary_production
    database: minato_production_cable
    migrations_paths: db/cable_migrate

  queue:
    <<: *primary_production
    database: minato_production_queue
    migrations_paths: db/queue_migrate
